<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chop Yew Lee 50th Anniversary</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
 <!-- =================================
         FLIP CONTAINER
    ================================== -->
  <div class="flip-container">
    <div class="flip-card" id="flipCard">
    <!-- =================================
    FRONT
    ================================== -->
      <div class="flip-front">
        <div class="header">
        <!-- =========================
        BACKGROUND
        ========================== -->
        <div class="bg-img"></div>
        <!-- =========================
        STEP 1 LOGIN
        ========================== -->
          <div class="container" id="loginSection">
            <h1> Welcome! </h1>
            <p>Please enter your phone number: </p>
            <input type="text" id="phoneInput"  placeholder="Enter phone number">
            <button id="submitBtn"> CHECK IN </button>
            <p id="showText"></p>
          </div>
        <!-- =========================
        STEP 2 WELCOME
        ========================== -->
          <div class="container hidden" id="guestSection">
            <h1 id="welcomeName"> Welcome! </h1>
            <p id="alreadyCheckedInNote" class="hidden">You've already checked in</p>
            <button id="tableBtn"> VIEW MY TABLE</button>
          </div>
        </div>
      </div>
    <!-- =================================
    BACK
    ================================== -->
    <div class="flip-back">
      <div class="floor_plan_container">
        <h1 style="color: #fafafa;" class="floor_plan_title">Find Your Table</h1>
      </div>
      <svg xmlns="http://www.w3.org/2000/svg" id="floorPlanSvg" viewBox="0 0 800 850" width="50%" height="auto" class="floor_plan">
      <defs>
        <!-- Styling Definitions -->
        <style>
          .border-wall { stroke: #333333; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
          .thin-wall { stroke: #666666; stroke-width: 2; fill: none; }
          .stage { fill: #e2e8f0; stroke: #475569; stroke-width: 2; }
          .av-console { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
          .walkway { fill: #dc2626; opacity: 0.95; }
          .table-circle { fill: #ffffff; stroke: #334155; stroke-width: 1.5; }
          .chair-circle { fill: #ffffff; stroke: #64748b; stroke-width: 1; }
          .vip-table { fill: #fef08a; stroke: #ca8a04; stroke-width: 2; }
          .text-main { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; fill: #1e293b; font-weight: 600; text-anchor: middle; }
          .text-sub { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; text-anchor: middle; }
          .text-bold { font-weight: bold; }
          .text-left { text-anchor: start; }
          .door { stroke: #64748b; stroke-width: 2; fill: none; }
        </style>

        <!-- Reusable 10-Pax Normal Table Template -->
        <g id="normal-table">
          <!-- 10 Chairs arranged radially -->
          <circle cx="0" cy="-24" r="4" class="chair-circle" />
          <circle cx="14" cy="-19" r="4" class="chair-circle" />
          <circle cx="23" cy="-7" r="4" class="chair-circle" />
          <circle cx="23" cy="7" r="4" class="chair-circle" />
          <circle cx="14" cy="19" r="4" class="chair-circle" />
          <circle cx="0" cy="24" r="4" class="chair-circle" />
          <circle cx="-14" cy="19" r="4" class="chair-circle" />
          <circle cx="-23" cy="7" r="4" class="chair-circle" />
          <circle cx="-23" cy="-7" r="4" class="chair-circle" />
          <circle cx="-14" cy="-19" r="4" class="chair-circle" />
          <!-- Main Table Surface -->
          <circle cx="0" cy="0" r="18" class="table-circle" />
        </g>

        <!-- Reusable 10-Pax VIP Table Template -->
        <g id="vip-table-group">
          <!-- 10 Chairs arranged radially (slightly larger spacing) -->
          <circle cx="0" cy="-28" r="4.5" class="chair-circle" />
          <circle cx="16" cy="-22" r="4.5" class="chair-circle" />
          <circle cx="27" cy="-9" r="4.5" class="chair-circle" />
          <circle cx="27" cy="9" r="4.5" class="chair-circle" />
          <circle cx="16" cy="22" r="4.5" class="chair-circle" />
          <circle cx="0" cy="28" r="4.5" class="chair-circle" />
          <circle cx="-16" cy="22" r="4.5" class="chair-circle" />
          <circle cx="-27" cy="9" r="4.5" class="chair-circle" />
          <circle cx="-27" cy="-9" r="4.5" class="chair-circle" />
          <circle cx="-16" cy="-22" r="4.5" class="chair-circle" />
          <!-- VIP Table Surface -->
          <circle cx="0" cy="0" r="22" class="vip-table" />
          <text x="0" y="4" class="text-main" font-size="11" fill="#854d0e">VIP</text>
        </g>
      </defs>

      <!-- Background Layer -->
      <rect width="100%" height="100%" fill="#fcfcfc"/>

      <!-- Ballroom Main Outer Walls -->
      <path d="M 60,30 L 320,30 L 320,10 L 480,10 L 480,30 L 740,30 L 740,780 L 60,780 Z" class="border-wall" />
      
      <!-- Architectural Pillars / Niches at the Bottom Door Wall -->
      <path d="M 60,780 L 100,780 L 100,810 L 140,810 L 140,780 
              L 220,780 L 220,810 L 260,810 L 260,780 
              L 340,780 L 340,810 L 460,810 L 460,780 
              L 540,780 L 540,810 L 580,810 L 580,780 
              L 660,780 L 660,810 L 700,810 L 700,780 L 740,780" class="thin-wall" />

      <!-- Stage Definition -->
      <rect x="280" y="80" width="240" height="135" rx="4" class="stage" />
      <text x="400" y="145" class="text-main text-bold" font-size="16">Stage</text>
     
      <!-- AV Console Layout -->
      <rect x="170" y="90" width="25" height="130" rx="2" class="av-console" />
      <!-- AV Knobs/Details -->
      <g fill="#94a3b8">
        <circle cx="182.5" cy="105" r="3" /><circle cx="182.5" cy="117" r="3" /><circle cx="182.5" cy="129" r="3" />
        <circle cx="182.5" cy="141" r="3" /><circle cx="182.5" cy="153" r="3" /><circle cx="182.5" cy="165" r="3" />
        <circle cx="182.5" cy="177" r="3" /><circle cx="182.5" cy="189" r="3" /><circle cx="182.5" cy="201" r="3" />
      </g>
      <text x="155" y="160" class="text-main" transform="rotate(-90 155 160)" font-size="13">AV Console</text>

      <!-- Ballroom Headers / Texts -->
      <text x="400" y="25" class="text-sub text-bold">Ballroom 2 Entrance Above</text>
      
      <!-- T-Shaped Red Carpet Walkway -->
      <!-- Vertical Strip -->
      <rect x="382" y="395" width="36" height="355" class="walkway" />
      <!-- Horizontal Base Strip -->
      <rect x="330" y="740" width="140" height="30" class="walkway" />

      <!-- Centered VIP Table -->
      <use href="#vip-table-group" x="400" y="355" id="table-vip" />

      <!-- Normal Tables Layout -->
      <!-- Row 1 (Top Row, Tables 1-3 Left, 4-6 Right) -->
      <use href="#normal-table" x="210" y="440" id="table-1" /><text x="210" y="444" class="text-sub">1</text>
      <use href="#normal-table" x="280" y="440" id="table-2" /><text x="280" y="444" class="text-sub">2</text>
      <use href="#normal-table" x="350" y="440" id="table-3" /><text x="350" y="444" class="text-sub">3</text>
      
      <use href="#normal-table" x="450" y="440" id="table-4" /><text x="450" y="444" class="text-sub">4</text>
      <use href="#normal-table" x="520" y="440" id="table-5" /><text x="520" y="444" class="text-sub">5</text>
      <use href="#normal-table" x="590" y="440" id="table-6" /><text x="590" y="444" class="text-sub">6</text>

      <!-- Row 2 (Middle Row, Tables 13-10 Left, 9-7 Right) -->
      <use href="#normal-table" x="140" y="535" id="table-13" /><text x="140" y="539" class="text-sub">13</text>
      <use href="#normal-table" x="210" y="535" id="table-12" /><text x="210" y="539" class="text-sub">12</text>
      <use href="#normal-table" x="280" y="535" id="table-11" /><text x="280" y="539" class="text-sub">11</text>
      <use href="#normal-table" x="350" y="535" id="table-10" /><text x="350" y="539" class="text-sub">10</text>
      
      <use href="#normal-table" x="450" y="535" id="table-9" /><text x="450" y="539" class="text-sub">9</text>
      <use href="#normal-table" x="520" y="535" id="table-8" /><text x="520" y="539" class="text-sub">8</text>
      <use href="#normal-table" x="590" y="535" id="table-7" /><text x="590" y="539" class="text-sub">7</text>

      <!-- Row 3 (Bottom Row, Tables 14-17 Left, 18-20 Right) -->
      <use href="#normal-table" x="140" y="630" id="table-14" /><text x="140" y="634" class="text-sub">14</text>
      <use href="#normal-table" x="210" y="630" id="table-15" /><text x="210" y="634" class="text-sub">15</text>
      <use href="#normal-table" x="280" y="630" id="table-16" /><text x="280" y="634" class="text-sub">16</text>
      <use href="#normal-table" x="350" y="630" id="table-17" /><text x="350" y="634" class="text-sub">17</text>
      
      <use href="#normal-table" x="450" y="630" id="table-18" /><text x="450" y="634" class="text-sub">18</text>
      <use href="#normal-table" x="520" y="630" id="table-19" /><text x="520" y="634" class="text-sub">19</text>
      <use href="#normal-table" x="590" y="630" id="table-20" /><text x="590" y="634" class="text-sub">20</text>

    </svg>
          <img class="parking_bg_pic" src="image/Foyer_park_vertical.jpg" alt="parking_bg_pic">
          <h1 id="finalTableNumber"></h1>
          <p style="color: #fafafa";> Please proceed to your designated table. </p>
          <a href="parking.html" class="parking_button" target="_blank"><span class="parking_text">PARKING TICKET</span></a>
     </div>
    </div>
  </div>
    <script src="script.js"></script>
</body>

</html>
